<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Acceso administrativo — Gustavo Behrens Propiedades
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/admin.css') }}">

</head>


<body class="login-body">


    <main class="login-container">


        <section class="login-card">


            <div class="login-logo">

                GB

            </div>


            <h1>
                Gustavo Behrens
            </h1>

            <h2>
                Propiedades
            </h2>


            <p class="login-subtitulo">
                Acceso administrativo
            </p>


            {% if error %}

                <div class="login-error">

                    {{ error }}

                </div>

            {% endif %}


            <form
                method="post"
                action="/admin/login"
            >


                <div class="login-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        required
                        autocomplete="username"
                    >

                </div>


                <div class="login-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="btn-login"
                >
                    Ingresar
                </button>


            </form>


            <a
                href="/"
                class="login-volver"
            >
                ← Volver al sitio
            </a>


        </section>


    </main>


</body>

</html>
