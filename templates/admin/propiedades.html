<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración — Propiedades</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/admin.css') }}">

</head>

<body>

    <header class="admin-header">

        <div>
            <h1>Gustavo Behrens Propiedades</h1>
            <span>Panel administrativo</span>
        </div>

        <div>

    <a href="/" class="btn-volver">
        ← Ver sitio
    </a>

    <a
        href="/admin/logout"
        class="btn-volver"
        style="margin-left: 8px;"
    >
        Cerrar sesión
    </a>

</div>

    </header>


    <main class="admin-container">

        <section class="admin-card">

            <h2>Agregar propiedad</h2>

            <p class="subtitulo">
                Completá los datos para publicar una nueva propiedad.
            </p>


            <form id="form-propiedad">


                <div class="form-grid">


                    <div class="form-group">

                        <label for="tipo">
                            Tipo de propiedad
                        </label>

                        <select id="tipo" required>

                            <option value="">
                                Seleccionar...
                            </option>

                            <option value="Casa">
                                Casa
                            </option>

                            <option value="Departamento">
                                Departamento
                            </option>

                            <option value="Terreno">
                                Terreno
                            </option>

                            <option value="Local">
                                Local
                            </option>

                            <option value="Oficina">
                                Oficina
                            </option>

                            <option value="Campo">
                                Campo
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="titulo">
                            Título
                        </label>

                        <input
                            type="text"
                            id="titulo"
                            placeholder="Ej: Casa en excelente ubicación"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="precio">
                            Precio
                        </label>

                        <input
                            type="number"
                            id="precio"
                            placeholder="Ej: 150000"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="ubicacion">
                            Ubicación
                        </label>

                        <input
                            type="text"
                            id="ubicacion"
                            placeholder="Ej: Salto - Centro"
                            required
                        >

                    </div>


                    <div class="form-group form-full">

                        <label for="imagen_url">
                            URL de imagen
                        </label>

                        <input
                            type="url"
                            id="imagen_url"
                            placeholder="https://..."
                        >

                        <small>
                            Por ahora utilizamos una imagen mediante URL.
                        </small>

                    </div>


                    <div class="form-group form-full">

                        <label for="descripcion">
                            Descripción
                        </label>

                        <textarea
                            id="descripcion"
                            rows="5"
                            placeholder="Describí las características de la propiedad..."
                        ></textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn-guardar"
                    >
                        Guardar propiedad
                    </button>

                    <button
                        type="reset"
                        class="btn-limpiar"
                    >
                        Limpiar
                    </button>

                </div>


                <div
                    id="mensaje"
                    class="mensaje"
                ></div>

            </form>

        </section>


        <section class="admin-card">

            <div class="lista-header">

                <div>

                    <h2>Propiedades cargadas</h2>

                    <p class="subtitulo">
                        Propiedades almacenadas en MySQL.
                    </p>

                </div>

                <button
                    id="btn-actualizar"
                    class="btn-actualizar"
                >
                    Actualizar
                </button>

            </div>


            <div class="tabla-container">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Título</th>
                            <th>Precio</th>
                            <th>Ubicación</th>
                            <th>Acción</th>

                        </tr>

                    </thead>

                    <tbody id="tabla-propiedades">

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script
        src="{{ url_for('static', path='js/admin.js') }}">
    </script>

</body>

</html>
